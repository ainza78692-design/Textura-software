name: Production deploy

on:
  workflow_dispatch:
  push:
    branches:
      - production
      - main

concurrency:
  group: textura-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy on client server
    runs-on:
      - self-hosted
      - linux
    environment: production
    steps:
      - name: Pull latest code on server
        shell: bash
        run: |
          cd /opt/textura/app/textura-erp-web-source
          git pull
          cd backend
          npm ci --omit=dev --ignore-scripts
          sudo systemctl restart textura-backend@blue || true
          sudo systemctl restart textura-backend@green || true
          echo "Deployment complete!"
