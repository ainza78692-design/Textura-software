name: Production deploy

on:
  workflow_dispatch:
  push:
    branches:
      - production
      - main

concurrency:
  group: textura-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy on client server
    runs-on:
      - self-hosted
      - linux
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Deploy Textura
        shell: bash
        run: chmod +x ./ops/linux/deploy-production.sh && ./ops/linux/deploy-production.sh
