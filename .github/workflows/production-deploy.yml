name: Textura CI and production deployment

on:
  pull_request:
    branches:
      - main
      - production
  push:
    branches:
      - main
      - production
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: textura-production-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  PROJECT_DIR: textura-erp-web-source

jobs:
  validate:
    name: Validate and package backend
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.PROJECT_DIR }}/backend/package-lock.json

      - name: Install locked backend dependencies
        run: npm --prefix "${{ env.PROJECT_DIR }}/backend" ci

      - name: Audit backend production dependencies
        run: npm --prefix "${{ env.PROJECT_DIR }}/backend" audit --omit=dev --audit-level=critical

      - name: Run backend tests
        run: |
          cd "${{ env.PROJECT_DIR }}/backend"
          npm test

      - name: Package immutable backend server release
        id: package
        shell: bash
        run: |
          release_id="${GITHUB_SHA:0:12}"
          project_dir="${{ env.PROJECT_DIR }}"
          stage="$RUNNER_TEMP/textura-release"
          archive="$RUNNER_TEMP/textura-server-$release_id.zip"

          mkdir -p "$stage/backend" "$stage/database"
          cp "$project_dir/backend/package.json" "$project_dir/backend/package-lock.json" "$stage/backend/"
          cp -R "$project_dir/backend/dist" "$stage/backend/dist"
          cp -R "$project_dir/database/migrations" "$stage/database/migrations"
          if [[ -f "$project_dir/updates/version.json" ]]; then
            mkdir -p "$stage/updates"
            cp "$project_dir/updates/version.json" "$stage/updates/"
          fi

          cat > "$stage/release.json" <<JSON
          {
            "releaseId": "$release_id",
            "commit": "${{ github.sha }}",
            "repository": "${{ github.repository }}",
            "runId": "${{ github.run_id }}",
            "builtAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          JSON

          (cd "$stage" && zip -qr "$archive" .)
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Upload backend server release
        uses: actions/upload-artifact@v4
        with:
          name: textura-server-${{ github.sha }}
          path: ${{ steps.package.outputs.archive }}
          retention-days: 30
          if-no-files-found: error

  deploy:
    name: Blue-green production deployment
    if: github.ref == 'refs/heads/production' && github.event_name != 'pull_request'
    needs: validate
    runs-on:
      - self-hosted
      - linux
      - x64
      - textura-production
    environment:
      name: production
    timeout-minutes: 30

    steps:
      - name: Checkout deployment tooling only
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            textura-erp-web-source/ops/linux
          sparse-checkout-cone-mode: true

      - name: Download validated backend release
        uses: actions/download-artifact@v4
        with:
          name: textura-server-${{ github.sha }}
          path: ${{ runner.temp }}/textura-artifact

      - name: Locate release archive
        id: artifact
        shell: bash
        run: |
          archive="$(find "${{ runner.temp }}/textura-artifact" -maxdepth 1 -name '*.zip' -print -quit)"
          if [[ -z "$archive" ]]; then
            echo "Validated release archive was not downloaded." >&2
            exit 1
          fi
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Deploy with health-gated cutover
        shell: bash
        env:
          TEXTURA_INSTALL_ROOT: ${{ vars.TEXTURA_INSTALL_ROOT }}
          TEXTURA_PUBLIC_HEALTH_URL: ${{ vars.TEXTURA_PUBLIC_HEALTH_URL }}
          TEXTURA_DEPLOY_WEBHOOK_URL: ${{ secrets.TEXTURA_DEPLOY_WEBHOOK_URL }}
        run: |
          install_root="${TEXTURA_INSTALL_ROOT:-/opt/textura}"
          health_url="${TEXTURA_PUBLIC_HEALTH_URL:-http://127.0.0.1:3000/health/ready}"
          release_id="${GITHUB_SHA:0:12}"

          chmod +x "${{ env.PROJECT_DIR }}/ops/linux/"*.sh
          sudo "${{ env.PROJECT_DIR }}/ops/linux/deploy-production.sh" \
            --artifact "${{ steps.artifact.outputs.archive }}" \
            --release-id "$release_id" \
            --install-root "$install_root" \
            --public-health-url "$health_url"

      - name: Collect deployment logs
        if: always()
        shell: bash
        run: |
          install_root="${{ vars.TEXTURA_INSTALL_ROOT }}"
          install_root="${install_root:-/opt/textura}"
          source="$install_root/logs/deploy"
          target="$RUNNER_TEMP/textura-deployment-logs"
          mkdir -p "$target"
          if [[ -d "$source" ]]; then
            sudo cp -f "$source"/* "$target"/ 2>/dev/null || true
            sudo chown -R "$(id -u):$(id -g)" "$target" || true
          fi

      - name: Upload deployment logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-deploy-logs-${{ github.run_id }}
          path: ${{ runner.temp }}\textura-deployment-logs
          retention-days: 30
          if-no-files-found: warn

  notify:
    name: Notify deployment result
    if: always() && github.ref == 'refs/heads/production' && github.event_name != 'pull_request'
    needs:
      - validate
      - deploy
    runs-on: ubuntu-latest

    steps:
      - name: Send optional webhook notification
        shell: bash
        env:
          WEBHOOK_URL: ${{ secrets.TEXTURA_DEPLOY_WEBHOOK_URL }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        run: |
          if [[ -z "${WEBHOOK_URL:-}" ]]; then
            echo "TEXTURA_DEPLOY_WEBHOOK_URL is not configured; skipping notification."
            exit 0
          fi

          python - <<'PY' | curl -fsS -X POST -H 'Content-Type: application/json' --data @- "$WEBHOOK_URL"
          import json, os
          print(json.dumps({
            "text": f"Textura production pipeline: validation={os.environ['VALIDATE_RESULT']}, deployment={os.environ['DEPLOY_RESULT']}, commit=${{ github.sha }}, run=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }))
          PY
